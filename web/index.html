<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TapToTalk</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="screen">
      <p class="eyebrow">Communication aid</p>
      <h1>TapToTalk</h1>
      <p class="status">Hello</p>
      <div class="grid" role="list" aria-label="Phrase categories">
        <div class="tile highlight" role="listitem" data-category="needs">Needs</div>
        <div class="tile" role="listitem" data-category="pain_comfort">Pain / comfort</div>
        <div class="tile" role="listitem" data-category="people">People</div>
        <div class="tile" role="listitem" data-category="yes_no">Yes / no</div>
      </div>
      <p class="note">
        Hello. The bridge is not connected, so this highlight is only a placeholder.
      </p>
      <p class="nav"><a href="dashboard.html">Nurse requests</a></p>
    </main>
  </body>
</html>
